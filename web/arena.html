<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level Up — Kite Fight: Robot Arena</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="arena-page">
  <header class="top">
    <h1>Robot Arena <span class="sub">12 robot players per version of Level 1, replayed from the live Flagsmith run (tag run-live-20261127-0748)</span></h1>
    <nav><a href="./">&larr; Play the game</a></nav>
  </header>
  <section class="controls">
    <label class="file">Load runs/*.json <input type="file" id="file" accept=".json" /></label>
    <label>Speed
      <select id="speed"><option>1</option><option selected>2</option><option>4</option><option>8</option></select>x
    </label>
    <button id="restart">Restart</button>
    <span id="source" class="muted"></span>
  </section>
  <main id="lanes" class="lanes"></main>
  <footer class="muted foot">Traffic is simulated by robot players. Bots never know their version: they only see the screen.</footer>
  <script type="module" src="./src/arena.js"></script>
</body>
</html>
