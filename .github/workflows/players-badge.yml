# Every 30 minutes: ask Flagsmith how many real players have played, and update badges/players.json.
# Needs two repository secrets: FLAGSMITH_ADMIN_API_KEY and FLAGSMITH_ENVIRONMENT_KEY_AA.
name: Players badge
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count players
        env:
          FLAGSMITH_ADMIN_API_KEY: ${{ secrets.FLAGSMITH_ADMIN_API_KEY }}
          FLAGSMITH_ENVIRONMENT_KEY_AA: ${{ secrets.FLAGSMITH_ENVIRONMENT_KEY_AA }}
        run: node scripts/players-badge.mjs
      - name: Save the new count
        run: |
          git config user.name "players-badge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add badges/players.json
          git diff --cached --quiet || (git commit -m "Update real-player count [skip ci]" && git push)
